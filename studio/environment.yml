# =============================================================================
# SFPPy Studio — Conda Environment
# =============================================================================
#
# Complete conda environment for Studio (interactive web GUI).
# Installs all dependencies from conda-forge for better compatibility.
#
# Create environment:
#   conda env create -f studio/environment.yml
#
# Or with mamba (faster):
#   mamba env create -f studio/environment.yml
#
# Activate:
#   conda activate sfppy-studio
#
# Update existing environment:
#   conda env update -f studio/environment.yml --prune
#
# Alternative installation methods:
#   - Root environment.yml    (full SFPPy with Studio + Survey)
#   - pip install -e ".[studio]"  (from SFPPy root)
#   - requirements/studio.txt     (modular pip requirements)
#   - docker/docker-compose.yml   (Docker deployment)
#
# Launch application:
#   python studio/launcher.py           # Default port 8002
#   python studio/launcher.py --port 9002  # Custom port
#
# =============================================================================

name: sfppy-studio

channels:
  - conda-forge
  - defaults

dependencies:
  # ---------------------------------------------
  # Python
  # ---------------------------------------------
  - python>=3.10

  # ---------------------------------------------
  # Core Scientific Stack (SFPPy kernel)
  # ---------------------------------------------
  - numpy>=1.21
  - scipy>=1.7
  - matplotlib>=3.5
  - pandas>=1.3

  # ---------------------------------------------
  # Configuration & File I/O
  # ---------------------------------------------
  - pyyaml>=6.0             # YAML configuration
  - openpyxl>=3.1           # XLSX export
  - pillow>=8.0             # Images (PubChem thumbnails)

  # ---------------------------------------------
  # Web Application
  # ---------------------------------------------
  - fastapi>=0.100
  - uvicorn>=0.23
  - pydantic>=2.0
  - jinja2>=3.1
  - python-multipart>=0.0.6
  - requests>=2.28           # PubChem API

  # ---------------------------------------------
  # Development & Testing
  # ---------------------------------------------
  - pytest>=7.0
  - pytest-cov>=4.0

  # ---------------------------------------------
  # pip for additional packages
  # ---------------------------------------------
  - pip
  - pip:
    - httpx>=0.24.0          # Testing FastAPI
