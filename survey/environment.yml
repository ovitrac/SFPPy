# SFPPy Survey Module Environment
# ================================
#
# Install with:
#   conda env create -f environment.yml
#   conda activate sfppy
#
# Or with mamba (faster):
#   mamba env create -f environment.yml
#   mamba activate sfppy
#
# Update existing environment:
#   conda env update -f environment.yml

name: sfppy

channels:
  - conda-forge
  - defaults

dependencies:
  # Core Python
  - python>=3.9

  # Scientific stack (base SFPPy)
  - numpy>=1.20
  - scipy>=1.7
  - matplotlib>=3.5
  - pyyaml>=6.0

  # FastAPI application
  - fastapi>=0.100
  - uvicorn>=0.23
  - pydantic>=2.0
  - python-multipart>=0.0.6
  - jinja2>=3.1

  # Spreadsheet support
  - openpyxl>=3.1
  - odfpy>=1.4

  # PubChem integration
  - requests>=2.28

  # Optional: for development/testing
  - pip
  - pip:
    - httpx  # For testing FastAPI
