# PET Migrants Family
#
# Substances commonly found migrating from PET packaging.
# Includes process contaminants and degradation products.

name: pet_migrants
description: "Common migrants from PET bottles and trays"

substances:
  - name: "acetaldehyde"
    cas: "75-07-0"
    full_name: "Acetaldehyde"
    C0_min: 0.0
    C0_likely: 5.0             # mg/kg
    C0_max: 20.0
    notes: "PET degradation product, flavor impact"

  - name: "ethylene glycol"
    cas: "107-21-1"
    full_name: "Ethylene glycol"
    C0_min: 0.0
    C0_likely: 10.0
    C0_max: 50.0
    notes: "Monomer residue"

  - name: "limonene"
    cas: "138-86-3"
    full_name: "D-Limonene"
    C0_min: 0.0
    C0_likely: 2.0
    C0_max: 15.0
    notes: "Scalping from citrus beverages"

  - name: "benzaldehyde"
    cas: "100-52-7"
    full_name: "Benzaldehyde"
    C0_min: 0.0
    C0_likely: 1.0
    C0_max: 8.0
    notes: "Oxidation product"

  - name: "2-methyl-1,3-dioxolane"
    cas: "497-26-7"
    C0_min: 0.0
    C0_likely: 3.0
    C0_max: 12.0
    notes: "Acetaldehyde reaction product"

# Notes:
# - PET migrants are typically low concentration
# - Acetaldehyde is the key quality indicator
# - Recycled PET may have higher levels
