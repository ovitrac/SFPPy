# Fatty Food in PP Tray — Survey Scenario
#
# Simulates migration from a PP thermoformed tray containing
# fatty foods (cheese, butter, ready meals) at refrigerated storage.
#
# Food simulant: olive oil (EU Simulant D2 for fatty foods)
# Typical packaging: PP thermoformed tray

name: fatty_PP_tray

physics:
  monolayer:
    polymer: PP                  # Polypropylene
    thickness_m: 400e-6          # 400 µm typical tray wall
    temperature_degC: 6.0        # Refrigerated storage

  interface:
    h_m_s: 1e-7                  # Mass transfer coefficient
    surface_area_m2: 0.025       # ~250 cm² (typical tray)
    food_volume_m3: 250e-6       # 250 mL
    contact_temperature_degC: 6.0
    cf0: 0.0
    food_simulant: oliveoil      # EU Simulant D2

# Substances: typical PP additives
family:
  substances:
    - cas: "2082-79-3"           # Irganox 1076 (antioxidant)
    - cas: "31570-04-4"          # Irgafos 168 (phosphite antioxidant)
    - cas: "112-84-5"            # Erucamide (slip agent)
    - cas: "301-02-0"            # Oleamide (slip agent)

priors:
  # Contact time: 14 days likely, up to 30 days
  time_s:
    triangular:
      min: 0.0
      mode: 1209600.0            # 14 days
      max: 2592000.0             # 30 days
    grid:
      nlow: 15
      nhigh: 15

  # Initial concentration (PP typically has moderate additive levels)
  cp0_av:
    triangular:
      min: 0.0
      mode: 200.0                # 200 mg/kg typical for PP
      max: 800.0                 # 800 mg/kg max
    grid:
      nlow: 15
      nhigh: 15

solver:
  pdf_bins: 250
  fo_grid:
    n_fo: 200
    fo_max_factor: 1.5
