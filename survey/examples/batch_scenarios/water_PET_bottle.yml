# Bottled Water in PET Bottle — Survey Scenario
#
# Simulates migration from a PET bottle containing mineral
# or spring water at ambient storage conditions.
#
# Food simulant: water (EU Simulant A)
# Typical packaging: PET blow-molded bottle

name: water_PET_bottle

physics:
  monolayer:
    polymer: gPET                # Glassy PET
    thickness_m: 180e-6          # 180 µm typical bottle wall
    temperature_degC: 25.0       # Ambient storage

  interface:
    h_m_s: 1e-7                  # Mass transfer coefficient
    surface_area_m2: 0.085       # ~850 cm² (1.5L bottle)
    food_volume_m3: 1500e-6      # 1500 mL
    contact_temperature_degC: 25.0
    cf0: 0.0
    food_simulant: water         # EU Simulant A

# Substances: typical PET additives
family:
  substances:
    - cas: "70321-86-7"          # Tinuvin 234 (UV stabilizer)
    - cas: "872-50-4"            # NMP (residual solvent)
    - cas: "301-02-0"            # Oleamide (slip agent)
    - cas: "124-26-5"            # Stearamide (slip agent)

priors:
  # Contact time: 1 year likely, up to 2 years (extended shelf life)
  time_s:
    triangular:
      min: 0.0
      mode: 31536000.0           # 365 days
      max: 63072000.0            # 730 days
    grid:
      nlow: 15
      nhigh: 15

  # Initial concentration based on typical PET formulation
  cp0_av:
    triangular:
      min: 0.0
      mode: 50.0                 # 50 mg/kg typical
      max: 200.0                 # 200 mg/kg max
    grid:
      nlow: 15
      nhigh: 15

solver:
  pdf_bins: 250
  fo_grid:
    n_fo: 200
    fo_max_factor: 1.5
