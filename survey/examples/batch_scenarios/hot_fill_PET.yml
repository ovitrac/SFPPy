# Hot-Fill PET Bottle — Survey Scenario
#
# Simulates migration from a PET bottle that undergoes hot-fill
# processing (juice, tea, acidic beverages) with initial high
# temperature contact followed by ambient storage.
#
# Food simulant: water with 3% acetic acid (EU Simulant B)
# Typical packaging: heat-set PET bottle

name: hot_fill_PET

physics:
  monolayer:
    polymer: PET                 # Standard PET (above Tg during hot-fill)
    thickness_m: 350e-6          # 350 µm thicker wall for hot-fill
    temperature_degC: 40.0       # Average temperature (hot-fill + storage)

  interface:
    h_m_s: 1e-7                  # Mass transfer coefficient
    surface_area_m2: 0.065       # ~650 cm² (1L bottle)
    food_volume_m3: 1000e-6      # 1000 mL
    contact_temperature_degC: 40.0
    cf0: 0.0
    food_simulant: water3aceticacid  # EU Simulant B (acidic)

# Substances: PET additives with focus on thermal degradation products
family:
  substances:
    - cas: "100-21-0"            # Terephthalic acid (PET monomer)
    - cas: "107-21-1"            # Ethylene glycol (PET monomer)
    - cas: "70321-86-7"          # Tinuvin 234 (UV stabilizer)
    - cas: "111-90-0"            # Diethylene glycol (PET by-product)

priors:
  # Contact time: 6 months likely, up to 12 months
  time_s:
    triangular:
      min: 0.0
      mode: 15768000.0           # 182.5 days (6 months)
      max: 31536000.0            # 365 days (1 year)
    grid:
      nlow: 15
      nhigh: 15

  # Initial concentration (higher due to hot processing)
  cp0_av:
    triangular:
      min: 0.0
      mode: 100.0                # 100 mg/kg
      max: 500.0                 # 500 mg/kg max
    grid:
      nlow: 15
      nhigh: 15

solver:
  pdf_bins: 250
  fo_grid:
    n_fo: 200
    fo_max_factor: 1.5
