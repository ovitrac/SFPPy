# Dairy Product in PET Pot — Survey Scenario
#
# Simulates migration from a PET thermoformed pot containing
# dairy products (yogurt, cream dessert) at refrigerated storage.
#
# Food simulant: ethanol 50% (EU Simulant D1 for dairy)
# Typical packaging: thermoformed PET pot with seal

name: dairy_PET_pot

physics:
  monolayer:
    polymer: gPET                # Glassy PET (below Tg at 6°C)
    thickness_m: 200e-6          # 200 µm typical pot wall
    temperature_degC: 6.0        # Refrigerated storage

  interface:
    h_m_s: 1e-7                  # Mass transfer coefficient
    surface_area_m2: 0.014       # ~140 cm² (125g pot)
    food_volume_m3: 125e-6       # 125 mL
    contact_temperature_degC: 6.0
    cf0: 0.0
    food_simulant: ethanol50     # EU Simulant D1

# Substances: typical PET additives
family:
  substances:
    - cas: "70321-86-7"          # Tinuvin 234 (UV stabilizer)
    - cas: "872-50-4"            # NMP (residual solvent)
    - cas: "301-02-0"            # Oleamide (slip agent)
    - cas: "124-26-5"            # Stearamide (slip agent)

priors:
  # Contact time: 30 days likely, up to 60 days (shelf life)
  time_s:
    triangular:
      min: 0.0
      mode: 2592000.0            # 30 days
      max: 5184000.0             # 60 days
    grid:
      nlow: 15
      nhigh: 15

  # Initial concentration based on typical PET formulation
  cp0_av:
    triangular:
      min: 0.0
      mode: 50.0                 # 50 mg/kg typical
      max: 200.0                 # 200 mg/kg max
    grid:
      nlow: 15
      nhigh: 15

solver:
  pdf_bins: 250
  fo_grid:
    n_fo: 200
    fo_max_factor: 1.5
